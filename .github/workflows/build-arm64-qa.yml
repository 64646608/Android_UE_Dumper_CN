name: Build PUBGM UE Dumper ARM64

on:
  push:
    branches:
      - qa-pubgm-sdk-adaptation-20261127
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pubgm-sdk-arm64-release
  cancel-in-progress: false

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source and KittyMemoryEx submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Android NDK r26d using preinstalled SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'ndk;26.3.11579264'

      - name: Build ARM64 executable
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          test -f deps/KittyMemoryEx/KittyMemoryEx/KittyMemoryMgr.cpp
          cd AndUEDumper
          "$NDK_HOME/ndk-build" NDK_PROJECT_PATH=. NDK_APPLICATION_MK=./Application.mk APP_ABI=arm64-v8a APP_PLATFORM=android-24 -j2
          test -s libs/arm64-v8a/UEDump3r_arm64
          file libs/arm64-v8a/UEDump3r_arm64
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h libs/arm64-v8a/UEDump3r_arm64 | grep -q AArch64
          sha256sum libs/arm64-v8a/UEDump3r_arm64

      - name: Publish directly as a new GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="pubgm-sdk-20261127-r${GITHUB_RUN_NUMBER}"
          ASSET="AndUEDumper/libs/arm64-v8a/UEDump3r_arm64"
          test -s "$ASSET"
          (
            cd "$(dirname "$ASSET")"
            sha256sum UEDump3r_arm64 > UEDump3r_arm64.sha256
          )
          CHECKSUM="${ASSET}.sha256"
          cat > release_notes.txt <<EOF
          PUBGM private-server SDK dumper ARM64 release.

          Package/profile: com.tencent.tmgp.pubgmhd
          Fixed current-version entries:
          - GNames RVA: 0x176E6650
          - GUObjectArray RVA: 0x17D46E08
          - ObjObjects RVA: 0x17D46E18
          - UObject.NamePrivate: 0x48
          - FNameEntry.Name: 0x0C

          Usage:
            su
            chmod 755 /data/local/tmp/UEDump3r_arm64
            /data/local/tmp/UEDump3r_arm64 -p com.tencent.tmgp.pubgmhd -o /sdcard/Download/PUBGM_SDK

          Current adaptation:
          - GNames fixed to verified current RVA 0x176E6650
          - live GUObjectArray signature/RVA/dereference probing
          - Flat/Chunked object-array layout probing
          - 0xB4 tagged UObject pointer normalization
          - runtime selection of object count / stride / InternalIndex / NamePrivate candidates


          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_RUN_ID
          No Actions artifact is uploaded or retained.
          EOF
          gh release create "$TAG" "$ASSET" "$CHECKSUM" \
            --target "$GITHUB_SHA" \
            --title "PUBGM SDK Dumper ARM64 ${GITHUB_RUN_NUMBER}" \
            --notes-file release_notes.txt \
            --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish,assets

      - name: Verify no Actions artifacts are retained
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IDS="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | test("UE4-Dumper|UEDump|PUBGM"; "i")) | .id')"
          for artifact_id in $IDS; do
            echo "Removing Actions artifact $artifact_id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
